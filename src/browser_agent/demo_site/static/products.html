<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products · Acme Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site">
  <span class="brand">Acme Demo</span>
  <nav aria-label="Main">
    <a href="index.html" data-volatile="nav-home">Home</a>
    <a href="products.html" data-volatile="nav-products">Products</a>
    <a href="pricing.html" data-volatile="nav-pricing">Pricing</a>
    <a href="contact.html" data-volatile="nav-contact">Contact</a>
    <a href="account.html" data-volatile="nav-account">Account</a>
  </nav>
</header>
<main>
<h1>Products</h1>
<label for="category">Category</label>
<select id="category" name="category">
  <option value="all">All</option>
  <option value="hardware">Hardware</option>
  <option value="software">Software</option>
</select>
<table id="products-table">
  <thead><tr><th>SKU</th><th>Name</th><th>Category</th><th>Stock</th></tr></thead>
  <tbody>
    <tr data-cat="hardware"><td>HW-100</td><td>Widget</td><td>Hardware</td><td>42</td></tr>
    <tr data-cat="hardware"><td>HW-200</td><td>Gadget</td><td>Hardware</td><td>7</td></tr>
    <tr data-cat="software"><td>SW-100</td><td>Toolkit</td><td>Software</td><td>999</td></tr>
    <tr data-cat="software"><td>SW-200</td><td>Analyzer</td><td>Software</td><td>999</td></tr>
  </tbody>
</table>
<p><button type="button" id="load-more">Load more</button> <span id="more-status" class="muted" role="status"></span></p>
<script>
window.pageInit = function () {
  var sel = document.getElementById("category");
  function apply() {
    document.querySelectorAll("#products-table tbody tr").forEach(function (r) {
      r.style.display = (sel.value === "all" || r.dataset.cat === sel.value) ? "" : "none";
    });
  }
  sel.addEventListener("change", apply);
  var btn = document.getElementById("load-more");
  btn.addEventListener("click", function () {
    btn.disabled = true; btn.textContent = "Loading…";
    setTimeout(function () {
      var more = [["HW-300","Sprocket","hardware","13"],["SW-300","Compiler","software","999"]];
      var body = document.querySelector("#products-table tbody");
      more.forEach(function (m) {
        var tr = document.createElement("tr"); tr.dataset.cat = m[2];
        [m[0], m[1], m[2][0].toUpperCase() + m[2].slice(1), m[3]].forEach(function (c) { var td = document.createElement("td"); td.textContent = c; tr.appendChild(td); });
        body.appendChild(tr);
      });
      btn.textContent = "Load more"; btn.disabled = false;
      document.getElementById("more-status").textContent = "Loaded " + more.length + " more rows";
      apply();
    }, 300);
  });
};
</script>
</main>
<footer>Local demo website for testing the browser agent. Nothing here is real.</footer>
<script src="app.js"></script>
</body>
</html>
